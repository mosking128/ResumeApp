appId: com.mosking.resumeapp
productName: ResumeApp
directories:
  output: release
files:
  - electron/**/*
  - dist/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ResumeApp-${version}-setup.${ext}
portable:
  artifactName: ResumeApp-${version}-portable.${ext}
publish: null
